syntax = "proto3";

package netstruct;

option go_package = "n2n-go/pkg/protocol/netstruct/pb";

// ICE candidate for P2P NAT traversal
message ICECandidate {
  string target_mac = 1;
  string candidate = 2;
  string sdp_mid = 3;
  uint32 sdp_mline_index = 4;
}

// TURN credentials for NAT traversal
message TURNCredentials {
  string username = 1;
  string password = 2;
  uint32 ttl = 3;
  repeated string uris = 4;
}