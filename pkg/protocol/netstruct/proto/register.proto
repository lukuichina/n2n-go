syntax = "proto3";

package netstruct;

option go_package = "n2n-go/pkg/protocol/netstruct";

// 对应 Go 中的 SNPublicSecret
message SnPublicSecret {
  bool is_request = 1;
  bytes pem_data = 2;
}

// 对应 Go 中的 RegisterRequest
message RegisterRequest {
  string edge_mac_addr = 1;
  string edge_desc = 2;
  string community_name = 3;
  bytes encrypted_machine_id = 4;
  bytes clear_machine_id = 5;
  string p2p_endpoint = 6;
  repeated string p2p_capabilities = 7;
  string nat_type = 8;
  string pub_socket = 9;
  // This edge's own LAN addresses, each paired with the local port of its P2P
  // socket, so a peer on the same broadcast domain can address it directly
  // instead of hairpinning through the local router.
  //
  // FRP parity: pkg/nathole/nathole.go:145-149 builds the same list into
  // NatHoleReport.AssistedAddrs from ListLocalIPsForNatHole. It is reported
  // alongside pub_socket rather than merged into it because the two are tried
  // in a fixed order by the punching side (assisted first), not as an
  // unordered set.
  repeated string assisted_sockets = 10;
}

// 对应 Go 中的 RetryRegisterRequest
message RetryRegisterRequest {}

// 对应 Go 中的 RegisterResponse
message RegisterResponse {
  bool is_register_ok = 1;
  string virtual_ip = 2;
  int32 masklen = 3;
}

// 对应 Go 中的 HeartbeatPulse
message HeartbeatPulse {
  string edge_mac_addr = 1;
  string community_name = 2;
  bytes encrypted_machine_id = 3;
  bytes clear_machine_id = 4;
}

// 对应 Go 中的 UnregisterRequest
message UnregisterRequest {
  string edge_mac_addr = 1;
  string community_name = 2;
  bytes encrypted_machine_id = 3;
}